services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: pos-cashier-app-dev
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html
      - /var/www/html/vendor
      - /var/www/html/node_modules
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - APP_KEY=${APP_KEY}
      - APP_URL=http://localhost:8000
      - DB_CONNECTION=sqlite
    networks:
      - pos-network

networks:
  pos-network:
    driver: bridge
